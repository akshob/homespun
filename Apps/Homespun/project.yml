# Generate the Xcode project on a Mac:  brew install xcodegen && xcodegen generate
name: Homespun
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  HomespunPackage:
    path: ../..
targets:
  Homespun:
    type: application
    platform: iOS
    sources: [Homespun]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: Homespun/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # homespun://pair?… links from `homespun-server pair` (QR code or pasted).
        CFBundleURLTypes:
          - CFBundleURLName: photos.homespun.pair
            CFBundleURLSchemes: [homespun]
        NSBonjourServices: [_homespun._tcp]
        # Automatic mode (Premium) runs as a background processing task.
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [photos.homespun.app.automatic]
        # Plain HTTP only to servers on the home network (IP addresses and .local names).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: HomespunPackage
        product: HomespunCore
      - package: HomespunPackage
        product: HomespunMedia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HOMESPUN_BUNDLE_ID)
        PRODUCT_NAME: Homespun
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Homespun
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Homespun reads the photos and videos you choose so it can store the originals on your server and make compact copies."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Homespun saves compact copies of your photos and videos to your library."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Homespun finds and connects to your Homespun Server on your home network."
        INFOPLIST_KEY_NSCameraUsageDescription: "Homespun scans the QR code your server shows when you pair it."
  # Runs inside the app on a simulator whose library holds only synthetic media.
  HomespunTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HomespunTests]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - target: Homespun
      - package: HomespunPackage
        product: HomespunTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HOMESPUN_BUNDLE_ID).tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
  # Drives the workflows through the app's own screens on a simulator.
  HomespunUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HomespunUITests]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - target: Homespun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HOMESPUN_BUNDLE_ID).uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Homespun
schemes:
  Homespun:
    build:
      targets:
        Homespun: all
    run:
      # Purchases in builds run from Xcode use this local App Store, never real money.
      storeKitConfiguration: Homespun.storekit
    test:
      targets: [HomespunTests, HomespunUITests]
