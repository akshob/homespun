# Validation for every change, on GitHub's own machines (Linux, and macOS with Xcode 27.2 and the
# iPhone 18 Pro and iPhone Duo simulators), so it runs here and not by hand (ci/README.md).
#   Every push: the server on Linux, the telemetry Worker, the package on macOS, the app's build and
#   unit tests, and a smoke run of the UI tests.
#   A pull request to main (or "full" from Run workflow): the whole UI suite, one run per machine
#   (iPhone, and iPhone Duo folded and open). Pull requests from forks run after the owner approves.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ui:
        description: UI tests
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  server-linux:
    name: Server (Linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    timeout-minutes: 45
    env:
      # The server notices it's in a container (/.dockerenv) and acts like a Docker install; the tests
      # describe a Linux computer.
      HOMESPUN_HARDWARE_KIND: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Libraries and tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libvips-dev libsqlite3-dev libheif-plugin-libde265 ffmpeg
      - uses: actions/cache@v4
        with:
          path: .build
          key: linux-build-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: linux-build-${{ hashFiles('Package.resolved') }}-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: |
          swift test --skip-build 2>&1 | tee test.log
          echo "### Server (Linux)" >> $GITHUB_STEP_SUMMARY
          grep -E "Test run with|✘" test.log | tail -20 | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          ! grep -q "✘" test.log

  telemetry:
    name: Telemetry Worker
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/telemetry/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    name: Build and package tests (macOS)
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Tools
        run: brew install --quiet xcodegen ffmpeg
      - uses: actions/cache@v4
        with:
          path: .build
          key: macos-build-${{ hashFiles('Package.resolved') }}-${{ env.HEAD_SHA }}
          restore-keys: macos-build-${{ hashFiles('Package.resolved') }}-
      - name: Build (server and app)
        run: BUILD_ARCHIVE=${{ runner.temp }}/build.tgz zsh ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: ${{ runner.temp }}/build.tgz
          retention-days: 2
          compression-level: 0
      - name: Package tests (macOS)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: swift test 2>&1 | tee ci-results/package.log | grep -E "Test run with|✘|error:" | tail -20; exit ${pipestatus[1]}
        shell: zsh {0}
      - name: Keep the results of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-results-${{ github.run_id }}
          path: ci-results
          retention-days: 5

  unit:
    name: App unit tests
    needs: build
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Tools
        run: brew install --quiet xcodegen ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: ${{ runner.temp }}
      - name: The build of this commit
        run: mkdir -p ~/ci/dd && tar -xzf ${{ runner.temp }}/build.tgz -C ~/ci/dd && zsh ci/build.sh
      - name: Unit tests (and the PhotoKit ones, in the app)
        run: zsh ci/unit.sh
      - name: Summary
        if: always()
        run: python3 ci/summary.py ci-results "App unit tests"
      - name: Keep the results of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-${{ github.run_id }}
          path: ci-results
          retention-days: 5

  ui:
    name: UI (${{ matrix.run }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON((github.event_name == 'pull_request' || inputs.ui == 'full') && '["iphone","library","later","copies","onboarding","telemetry","duo-cover","duo-grid","duo-open"]' || '["smoke"]') }}
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Tools
        run: brew install --quiet xcodegen ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: ${{ runner.temp }}
      - name: The build of this commit
        run: mkdir -p ~/ci/dd && tar -xzf ${{ runner.temp }}/build.tgz -C ~/ci/dd && zsh ci/build.sh
      - name: UI tests
        run: zsh ci/lane.sh ${{ matrix.run }}
      - name: Summary
        if: always()
        run: python3 ci/summary.py ci-results "UI (${{ matrix.run }})"
      - name: Keep the results of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.run }}-${{ github.run_id }}
          path: ci-results
          retention-days: 5
