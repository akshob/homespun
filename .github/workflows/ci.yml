# The extended suite after a merge to main: what changed, with every UI run (iPhone, iPhone Duo
# folded, iPhone Duo open in every pose) and the server's package tests on macOS; the website goes
# live when it changed. One run at a time: a running one finishes, and only the newest waiting
# merge runs next. A failure opens (or updates) the "main is failing" issue; a pass closes it.
# Run workflow tests any branch: UI runs none, quick, full, a single regression lane, or package only.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "design/**"]
  workflow_dispatch:
    inputs:
      ui:
        description: Checks or UI runs
        type: choice
        options: [none, quick, full, iphone, library, later, copies, onboarding, telemetry, duo-cover, duo-grid, duo-open, demo, watch, package]
        default: quick

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  HEAD_SHA: ${{ github.sha }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      server: ${{ steps.plan.outputs.server }}
      telemetry: ${{ steps.plan.outputs.telemetry }}
      site: ${{ steps.plan.outputs.site }}
      app: ${{ steps.plan.outputs.app }}
      package: ${{ steps.plan.outputs.package }}
      ui: ${{ steps.plan.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'main' }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          UI_INPUT: ${{ inputs.ui }}
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py'
          python3 ci/plan.py

  suite:
    name: CI
    needs: plan
    uses: ./.github/workflows/suite.yml
    with:
      ref: ${{ github.sha }}
      server: ${{ needs.plan.outputs.server == 'true' }}
      telemetry: ${{ needs.plan.outputs.telemetry == 'true' }}
      site: ${{ needs.plan.outputs.site == 'true' }}
      app: ${{ needs.plan.outputs.app == 'true' }}
      package: ${{ needs.plan.outputs.package == 'true' }}
      ui: ${{ needs.plan.outputs.ui }}
      retry: true


  deploy-site:
    name: Publish homespun.photos
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: website
      url: https://homespun.photos
    concurrency:
      group: website
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check it first
        run: |
          python3 ci/site-check.py site
          npx --yes html-validate@9.7.1 --config ci/htmlvalidate.json site/*.html
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site --project-name homespun --branch main \
            --commit-hash "$HEAD_SHA" --commit-message "$(git log -1 --format=%s)" --commit-dirty=true
      - name: The live site serves this commit's pages
        run: |
          sleep 10
          for page in index setup support privacy; do
            path=/$page; [[ $page == index ]] && path=/
            curl -fsS "https://homespun.photos$path?check=$HEAD_SHA" -o live.html
            title=$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' site/$page.html)
            grep -qF "<title>$title</title>" live.html || { echo "$path doesn't show this commit's title"; exit 1; }
          done
          echo "homespun.photos is up to date." >> $GITHUB_STEP_SUMMARY

  report:
    name: Report on main
    needs: suite
    if: always() && github.event_name == 'push' && needs.suite.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close "main is failing"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.suite.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="main is failing"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          commit=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [[ $RESULT == success ]]; then
            [[ -n $issue ]] && gh issue close $issue --comment "Passing again at $commit: $RUN"
            exit 0
          fi
          [[ $RESULT == cancelled ]] && exit 0
          body="The extended suite failed at $commit: $RUN"
          if [[ -n $issue ]]; then
            gh issue comment $issue --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
