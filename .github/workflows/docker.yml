# Builds the Homespun Server image for amd64 and arm64 and pushes it to GitHub's container
# registry: `main` from the main branch; `1.2.3`, `1.2` and (newest release only) `latest`
# from a v1.2.3 tag. Pre-release tags publish only their full version, e.g. `1.2.3-rc.1`.
# Each architecture builds on its own GitHub-hosted runner (no emulation), then one manifest
# list joins them.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Branch pushes only; tags always build.
    paths:
      - Package.swift
      - Package.resolved
      - Sources/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/homespun-server

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name the platform
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Check HTTPS and container health
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="$IMAGE@$DIGEST"
          docker pull "$image"
          container=$(docker run --detach --publish 127.0.0.1::8787 "$image")
          trap 'docker rm --force --volumes "$container"' EXIT
          for attempt in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            [ "$state" != healthy ] || break
            if [ "$state" = unhealthy ]; then docker logs "$container"; exit 1; fi
            sleep 2
          done
          [ "$state" = healthy ] || { docker logs "$container"; exit 1; }
          port=$(docker port "$container" 8787/tcp | cut -d: -f2)
          pin=$(docker exec "$container" homespun-server certificate | sed -n 's/^curl: --pinnedpubkey //p')
          test -n "$pin"
          curl --fail --silent --show-error --insecure --pinnedpubkey "$pin" "https://127.0.0.1:$port/api/v1/health"
          if curl --fail --silent --max-time 2 "http://127.0.0.1:$port/api/v1/health"; then
            echo "The listener accepted plaintext."
            exit 1
          fi

      - name: Export the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Tag the multi-architecture image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Is this the newest release?
        id: release
        env:
          REF: ${{ github.ref }}
          NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest=false
          if [[ $REF == refs/tags/v* && $NAME =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            newest=$(git ls-remote --tags --refs "https://github.com/$REPOSITORY" 'v*' \
              | sed 's#.*refs/tags/##' \
              | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | sort -V | tail -1)
            [[ $NAME == "$newest" ]] && latest=true
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
