# Uploads a TestFlight build of main, on request only: only the owner can start it, only for a commit
# that passed the extended suite (ci/release-guard.py), and the
# `testflight` environment (main only, the owner approves each run) holds the App Store Connect API
# key and the team. It runs on a fresh GitHub machine that's discarded afterwards; the build's
# symbols (for crash reports, scripts/symbolicate.py) are kept as the run's `dsyms-<build>` artifact.
name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Upload to TestFlight
    runs-on: xcode-27
    if: github.actor == github.repository_owner
    environment: testflight
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only a commit that passed the extended suite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 ci/release-guard.py ${{ github.sha }}
      - name: Tools
        run: brew install --quiet xcodegen
      - name: Signing inputs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf 'DEVELOPMENT_TEAM = %s\n' "$DEVELOPMENT_TEAM" > Apps/Homespun/Local.xcconfig
      - name: Archive and upload
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          HOMESPUN_BUILDS: ${{ runner.temp }}/builds
          # Empty until a separately approved relay is deployed and its public TLS endpoint is ready.
          HOMESPUN_WAKE_RELAY_URL: ${{ vars.HOMESPUN_WAKE_RELAY_URL }}
        run: |
          set -euo pipefail
          zsh Apps/Homespun/scripts/testflight.sh | tee upload.log
          build=$(python3 ci/uploaded_build.py upload.log)
          echo "BUILD=$build" >> $GITHUB_ENV
          echo "### TestFlight build $build" >> $GITHUB_STEP_SUMMARY
          python3 Apps/Homespun/scripts/asc.py wait "$build" | tee processing.log
          tail -1 processing.log >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the symbols
        uses: actions/upload-artifact@v4
        with:
          name: dsyms-${{ env.BUILD }}
          path: ${{ runner.temp }}/builds/${{ env.BUILD }}
          retention-days: 90
      - name: Remove signing inputs
        if: always()
        run: rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8 Apps/Homespun/Local.xcconfig
