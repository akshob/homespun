# Performance budgets on polonium's quiet runner: nightly at 3:00 (Pacific) and on demand. Needs
# the 35,000-photo simulator (ci/setup-perf-sim.sh, once).
name: Performance

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf
  cancel-in-progress: false

jobs:
  perf:
    name: Performance budgets
    runs-on: [self-hosted, macOS, homespun-ci]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Performance
        run: zsh ci/perf.sh
      - name: Summary
        if: always()
        run: python3 ci/summary.py ci-results "Performance"
      - name: Keep the results of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.run_id }}
          path: ci-results
          retention-days: 7
